[project]
name = "ecomdev-payments"
version = "0.1.0"
description = "Mini payment accounting system for an educational center."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "alembic>=1.14",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.setuptools]
packages = ["app", "app.api", "app.core", "app.db", "app.schemas", "app.services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
